[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deeppatho-gen"
version = "0.1.0"
description = "Multi-gene mutation prediction from TCGA-LUAD H&E slides (DeepPATHO / DeepPATH-style baselines)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
