# EGFR, Experiment C: frozen Phikon-v2 (Owkin, ViT-L, DINOv2) backbone + MMA,
# on the SAME stratified split as Experiment A (baseline) and Experiment B
# (UNI frozen) -- configs/egfr_stratified and configs/egfr_uni use
# train_frac=0.70/val_frac=0.15/split_seed=42; this matches exactly so the
# three experiments share identical train/val/test patients.

gene: EGFR
patch_coords: data/processed/patch_coords_tumor_only.csv
labels: data/raw/mutation_labels.csv

train_frac: 0.70
val_frac: 0.15
split_seed: 42

model:
  backbone: phikon_v2
  freeze_backbone: true
  num_classes: 1

augment: true
max_patches_per_slide: 300

batch_size: 32
lr: 1.0e-4
weight_decay: 1.0e-4
max_epochs: 40
early_stopping_patience: 8

num_workers: 4
torch_threads: 2
seed: 20240924

output_dir: runs/egfr_phikon/frozen
