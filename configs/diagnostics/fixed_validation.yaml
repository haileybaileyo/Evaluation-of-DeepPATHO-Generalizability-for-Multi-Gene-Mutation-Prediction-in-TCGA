# D: fixed patient-level validation run. Same split logic as production
# train.py (case_level_split), same TP53 label source, same tumor-filtered
# patch set -- but patch/epoch counts are reduced here so a run finishes in
# a diagnostic timeframe instead of hours.

gene: TP53
patch_coords: data/processed/patch_coords_tumor_only.csv
labels: data/raw/mutation_labels.csv

train_frac: 0.70
val_frac: 0.15
split_seed: 42               # same default as production train.py -- same patients land in the same splits

augment: true                 # matches attempt-3 production setting (the augmentation we added after attempt 1/2)
tumor_filtered: true          # patch_coords argument above already IS the tumor-filtered index; documented explicitly

max_patches_per_slide: 60     # cap for diagnostic speed -- NOT the production 600; recorded here so the
                               # difference from production is explicit, not silent
batch_size: 32
lr: 1.0e-4
weight_decay: 0.0
max_epochs: 20
early_stopping_patience: 6

# Pick exactly one -- do not mix criteria for checkpoint selection (per task spec)
checkpoint_selection_metric: val_loss   # or: val_auc

num_workers: 4
torch_threads: 2
seed: 20240923

output_dir: runs/diagnostics/fixed_validation_tp53
