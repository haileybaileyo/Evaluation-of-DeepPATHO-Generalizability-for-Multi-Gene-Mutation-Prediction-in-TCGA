# EGFR, Experiment D: UNI backbone FULLY FINE-TUNED (not frozen) + MMA +
# FC head, all 303M+8.5M params trainable. Same split/data/patch cap as
# configs/egfr_uni/train_config.yaml (Experiment B) so the only variable
# between the two runs is frozen-vs-fine-tuned.
#
# backbone_lr is 100x smaller than the head's lr: fine-tuning a 303M-param
# pretrained ViT on ~110k patches (a small dataset relative to UNI's
# pretraining corpus) with the head's lr would overwrite the pretrained
# features within a few steps. If this run destabilizes (NaN loss, val AUC
# collapsing to 0.5 early), drop backbone_lr further before concluding
# fine-tuning doesn't help.

gene: EGFR
patch_coords: data/processed/patch_coords_tumor_only.csv
labels: data/raw/mutation_labels.csv

train_frac: 0.70
val_frac: 0.15
split_seed: 42

model:
  backbone: uni_vit_l16
  freeze_backbone: false
  num_classes: 1

augment: true
max_patches_per_slide: 300

batch_size: 16          # halved vs. the frozen run: gradients now flow through UNI's 303M params too
lr: 1.0e-4               # MMA + FC head
backbone_lr: 1.0e-6       # UNI backbone (fine-tuning)
weight_decay: 1.0e-4
max_epochs: 40
early_stopping_patience: 8

num_workers: 4
torch_threads: 2
seed: 20240924

output_dir: runs/egfr_uni_finetune/full
