# EGFR, UNI frozen -- SAME split (split_seed=42, same train/val/test
# patients as configs/egfr_uni/train_config.yaml) but a different training
# seed (weight init + minibatch order), to get a second independent data
# point on UNI+MMA's performance and see whether it lands near the first
# run's slide AUC=0.615 or whether that was seed-specific.

gene: EGFR
patch_coords: data/processed/patch_coords_tumor_only.csv
labels: data/raw/mutation_labels.csv

train_frac: 0.70
val_frac: 0.15
split_seed: 42          # SAME as configs/egfr_uni -- identical patients, only training seed differs

model:
  backbone: uni_vit_l16
  freeze_backbone: true
  num_classes: 1

augment: true
max_patches_per_slide: 300

batch_size: 32
lr: 1.0e-4
weight_decay: 1.0e-4
max_epochs: 40
early_stopping_patience: 8

num_workers: 4
torch_threads: 2
seed: 1                  # only this differs from configs/egfr_uni/train_config.yaml (seed: 20240924)

output_dir: runs/egfr_uni_seed1/frozen
