# EGFR, Experiment B: frozen UNI (MahmoodLab, ViT-L/16) backbone + MMA +
# FC head, only MMA/head trainable -- transfer learning, directly comparable
# to egfr_stratified (Experiment A, from-scratch) and egfr_roadmap (Phikon-v2
# frozen backbone): same stratified split, same tumor-filtered patches, same
# patch cap.

gene: EGFR
patch_coords: data/processed/patch_coords_tumor_only.csv
labels: data/raw/mutation_labels.csv

train_frac: 0.70
val_frac: 0.15
split_seed: 42

model:
  backbone: uni_vit_l16
  freeze_backbone: true
  num_classes: 1

augment: true
max_patches_per_slide: 300

batch_size: 32
lr: 1.0e-4              # only MMA+head (8.5M params) are trainable
weight_decay: 1.0e-4
max_epochs: 40
early_stopping_patience: 8

num_workers: 4
torch_threads: 2
seed: 20240924

output_dir: runs/egfr_uni/frozen
